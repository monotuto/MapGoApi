version: '3.8'

services:
  poi-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: poi-api-server
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # Vous pouvez changer la région en modifiant l'URL ci-dessous.
      # Par défaut: La France entière
      - OSM_REGION_URL=https://download.geofabrik.de/europe/france-latest.osm.pbf
    volumes:
      - poi_data:/code/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

volumes:
  poi_data:
